<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Cookbook — Print Preview</title>
<link rel="stylesheet" href="./src/styles/cookbook.css?v=0.6.6">
<link rel="stylesheet" href="./src/styles/editor.css?v=0.7.1">
<script defer src="./src/scripts/cookbook.js?v=0.6.8"></script>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-heading">
    <strong>Family Cookbook <small>v0.7 · CSS print preview</small></strong>
    <span>US Letter · photo strip on page 1 only</span>
  </div>
  <div class="controls">
    <label>Photo width <input id="photoWidth" type="range" min="22" max="34" value="28" step="1"> <output id="photoWidthValue">28%</output></label>
    <label>Font size <input id="fontSize" type="range" min="9" max="11.5" step=".25" value="10"> <output id="fontSizeValue">10 pt</output></label>
    <label>Step spacing <input id="stepGap" type="range" min="3" max="14" value="8" step="1"> <output id="stepGapValue">8px</output></label>
    <label>Photo placement <select id="printMode"><option value="home">Inset photo</option><option value="commercial" selected>Edge-to-edge photo</option></select></label>
    <button id="printButton" type="button">Print / Save PDF</button>
  </div>
  <div class="status" id="status" role="status">Loading recipe…</div>
</header>
<div class="cookbook-layout">
  <nav class="recipe-sidebar" aria-label="Browse recipes">
    <details>
      <summary>Caribbean</summary>
      <button type="button" data-recipe="recipes/caribbean/caribbean-green-seasoning.json">Caribbean Green Seasoning</button>
    </details>
    <details>
      <summary>Dessert</summary>
      <button type="button" data-recipe="recipes/dessert/buttery-apple-tart.json">Buttery Apple Tart</button>
    </details>
    <details>
      <summary>Drinks</summary>
      <button type="button" data-recipe="recipes/drinks/mariano-margarita.json">Mariano Margarita</button>
    </details>
    <details>
      <summary>Greek</summary>
      <button type="button" data-recipe="recipes/greek/greek-marinade.json">Greek Marinade (DRAFT)</button>
    </details>
    <details>
      <summary>Indian</summary>
      <button type="button" data-recipe="recipes/indian/butter-masala-chicken.json">Butter Masala (Chicken)</button>
    </details>
    <details>
      <summary>Italian</summary>
      <button type="button" data-recipe="recipes/italian/rosemary-focaccia.json">Rosemary Focaccia</button>
      <button type="button" data-recipe="recipes/italian/pomodoro-sauce.json">Pomodoro Sauce</button>
    </details>
    <details>
      <summary>Japanese</summary>
      <button type="button" data-recipe="recipes/japanese/japanese-curry.json">Japanese Curry</button>
    </details>
    <details>
      <summary>Mexican</summary>
      <button type="button" data-recipe="recipes/mexican/pork-carnitas.json">Pork Carnitas</button>
    </details>
    <details open>
      <summary>Russian</summary>
      <button type="button" data-recipe="recipes/russian/latvian-stew.json">Latvian Stew</button>
    </details>
  </nav>
  <main id="pages" aria-label="Paginated recipe preview"></main>
</div>
</body>
</html>
