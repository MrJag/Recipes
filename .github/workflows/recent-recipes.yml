name: Refresh recent recipe cards
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update newest recipe index
        run: python scripts/update_recent_recipes.py
      - name: Commit when cards change
        run: |
          if ! git diff --quiet -- src/data/recent-recipes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/recent-recipes.json
            git commit -m "Refresh recently added recipe cards"
            git push
          fi
