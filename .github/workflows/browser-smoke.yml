name: Browser smoke test
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/scripts/**'
      - 'src/styles/**'
      - 'qa/browser-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start cookbook web server
        run: python3 -m http.server 8123 >/tmp/cookbook-http.log 2>&1 &
      - name: Test direct recipe links and navigation
        id: smoke
        continue-on-error: true
        run: node qa/browser-smoke.mjs
      - name: Publish smoke test result to repository
        if: always()
        run: |
          if [ -f qa/browser-smoke-result.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add qa/browser-smoke-result.json
            git commit -m "Record browser smoke test result" || exit 0
            git push
          fi
      - name: Fail if browser check failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
